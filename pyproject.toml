[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-bot"
version = "1.1.0"
description = "Decision Bot Revolut X: segnali, gate, paper, GUI"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1", "streamlit>=1.28"]

[project.scripts]
decision-bot = "revolutx_bot.cli:main"
revolutx-bot = "revolutx_bot.cli:main"

[tool.setuptools]
packages = ["revolutx_bot"]
